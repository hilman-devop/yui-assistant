<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>modeltest</title></head>
<body><div id="out">loading...</div>
<script src="/vendor/live2d.min.js"></script>
<script src="/vendor/live2dcubismcore.min.js"></script>
<script src="/vendor/pixi.min.js"></script>
<script src="/vendor/pixi-live2d-display.min.js"></script>
<script>
const out = document.getElementById("out");
const url = new URLSearchParams(location.search).get("m");
(async () => {
  const app = new PIXI.Application({ width: 300, height: 400 });
  document.body.appendChild(app.view);
  try {
    const t0 = performance.now();
    const model = await PIXI.live2d.Live2DModel.from(url);
    app.stage.addChild(model);
    out.textContent = `OK ${(performance.now()-t0)|0}ms w=${model.width|0} h=${model.height|0}`;
  } catch (e) {
    out.textContent = `FAIL: ${e.message || e}`;
  }
})();
</script></body></html>
